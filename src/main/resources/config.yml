# Item-lock 設定檔
# 所有顯示文字都在 messages.yml。
# 每個樣本可在 /itemlock gui 個別覆蓋下面的開關。
config-version: 3

# 禁止按 Q 丟出
deny-drop: false
# 禁止放到副手
deny-offhand: false
# 禁止當方塊放置
deny-block-place: true
# 禁止手持右鍵非儲存方塊（附魔台、合成台、祭壇等）
deny-altar-interact: true
# 禁止放進展示框或盔甲架
deny-entity-interact: false

hopper:
  # 允許漏斗從容器搬運
  allow-move: true
  # 允許漏斗吸取地上的掉落物
  allow-pickup: true

drop-protection:
  # 掉落物永不消失（true 可能造成卡頓）
  prevent-despawn: false

compatibility:
  shopkeepers:
    # 允許在交易介面使用
    allow-trading: true
    # 允許在商店編輯介面設定
    allow-editor: true
  eshulkerbox:
    # 允許在手持開啟的潛影盒中存取
    allow-handheld-shulkerbox: true
  virtual-shulkerbox:
    # 允許沒有方塊的虛擬潛影盒介面
    allow-virtual: true
  advancedspyinventory:
    # /invsee 玩家背包
    allow-player-inventory: true
    # /enderchest 末影箱
    allow-ender-chest: true
    # 生物背包（物品可能隨生物死亡掉落）
    allow-entity-inventory: false
  cmail:
    # 允許當作郵件附件
    allow-mail: true

feedback:
  actionbar:
    # 被擋下時在動作列顯示提示
    enabled: true
  sound:
    enabled: true
    type: ENTITY_VILLAGER_NO
    volume: 1.0
    pitch: 0.8
  # 提示冷卻（毫秒）
  cooldown-ms: 1000

gui:
  # 介面按鈕音效
  sounds: true

update-checker:
  # 啟動時檢查 GitHub 新版本
  check-on-startup: true
  # 有新版本時提醒有 itemlock.version 權限的玩家（登入 3 秒後）
  notify-on-join: true
