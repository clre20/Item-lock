# Item-lock 全域設定檔
# 註：個別保護樣品可在遊戲內輸入 /itemlock gui 自由獨立覆蓋以下全域開關設定。

# 是否禁止按 Q 丟棄受保護物品
# 功能說明：禁止玩家按 Q 鍵或拖曳丟出此物品，防範意外掉落於世界中被其他玩家撿走。
# 預設：false (關閉，允許丟棄)
deny-drop: false

# 是否禁止將受保護物品放置在副手
# 功能說明：封鎖 F 換手、基岩版 /geyser offhand 與副手槽放入，防範透過副手進行方塊偷放或違規交互。
# 預設：false (關閉，允許副手)
deny-offhand: false

# 是否禁止將受保護方塊放置在世界上
# 功能說明：禁止主手或副手將此上鎖物品作為方塊放置在世界上，避免具有方塊形態的貴重物品被放置化。
# 預設：true (開啟，禁止放置方塊)
deny-block-place: true

# 是否禁止手持受保護物品右鍵非純容器方塊 (祭壇、機器、附魔台等)
# 功能說明：禁止手持此物品右鍵附魔台、合成台、祭壇或自訂機械，防範物品被其他外掛的方塊轉化機制吞噬消耗。
# 預設：true (開啟，防祭壇轉化與非容器交互)
deny-altar-interact: true

# 是否禁止將受保護物品放入展示框或盔甲架
# 功能說明：禁止將此物品右鍵放入展示框或裝備在盔甲架上，防範被其他玩家利用實體漏洞或未受保區域取走。
# 預設：false (關閉，允許放入展示框/盔甲架)
deny-entity-interact: false

# 漏斗物流管制設定
hopper:
  # 是否允許漏斗抽取/傳送受保護物品
  # 功能說明：是否允許漏斗或漏斗礦車自容器中抽取並傳輸此物品，開啟時可進行自動化物流；關閉時杜絕漏斗吸取。
  # 預設：true (開啟，允許漏斗抽取傳輸)
  allow-move: true

  # 是否允許地面漏斗吸取掉落的受保護物品
  # 功能說明：是否允許地面上的漏斗直接吸取掉落在上方的此物品，開啟時支援掉落物收集；關閉時漏斗無法吸走。
  # 預設：true (開啟，允許地面漏斗拾取)
  allow-pickup: true

# 掉落實體安全防護
drop-protection:
  # 掉落物是否防止自然消失 (false: 5分鐘後正常消失防卡頓; true: 永遠不消失，預設 false)
  prevent-despawn: false

# 第三方外掛相容設定
compatibility:
  shopkeepers:
    # 是否允許在 Shopkeepers 交易介面使用受保護物品 (作為交易貨幣或換取獲得，預設 true)
    allow-trading: true
    # 是否允許在 Shopkeepers 設定/編輯介面 (Editor) 設定受保護物品 (預設 true)
    allow-editor: true
  eshulkerbox:
    # 是否允許在 eShulkerBox 空手/手持開啟的潛影盒介面中存取受保護物品 (預設 true)
    allow-handheld-shulkerbox: true
  virtual-shulkerbox:
    # 是否放行無方塊實體的虛擬潛影盒容器 (供隨身/手持潛影盒外掛存取受保護物品，預設 true)
    allow-virtual: true

# 反饋與體驗設定
feedback:
  actionbar:
    enabled: true
    message: "<red>⚠ 此物品受特殊保護，無法在此介面中進行修改或加工！</red>"
  sound:
    enabled: true
    type: "ENTITY_VILLAGER_NO"
    volume: 1.0
    pitch: 0.8
  # 提示與音效觸發冷卻時間 (毫秒)
  cooldown-ms: 1000

